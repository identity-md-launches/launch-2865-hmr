[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

[profile.default.fuzz]
runs = 512
seed = "0x144ded666ac8b406b18a386babcfea0c25dc02e78fa96c2aadd1498e601a604a"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
# Vendored dependencies keep their exact upstream bytes (see dependencies.json); only project code is formatted.
ignore = ["lib/**"]
